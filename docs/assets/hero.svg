<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
  <title id="title">From recognition to measurement</title>
  <desc id="desc">Pothole area estimation through local road geometry. A schematic road footprint connects RGB recognition, road geometry, and calibrated area.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e31"/><stop offset="1" stop-color="#07111e"/></linearGradient>
    <linearGradient id="road" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#21374a"/><stop offset="1" stop-color="#132437"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#68e3d2"/><stop offset="1" stop-color="#b8f8bb"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7190a7" opacity=".15"/></pattern>
  </defs>
  <rect width="1440" height="580" rx="26" fill="url(#bg)"/>
  <rect width="1440" height="580" rx="26" fill="url(#dots)"/>
  <path d="M0 566H1440" stroke="url(#line)" stroke-width="3"/>
  <g font-family="Inter,DejaVu Sans,Arial,sans-serif">
