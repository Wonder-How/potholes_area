    <text x="60" y="246" fill="#8bead1" font-size="66" font-weight="700" letter-spacing="-2">to measurement.</text>
    <text x="64" y="304" fill="#adbdca" font-size="22">Pothole area estimation through local road geometry</text>
    <text x="64" y="343" fill="#6f899c" font-size="18">One RGB image. A local road plane. A metric footprint.</text>
    <g transform="translate(64 408)">
