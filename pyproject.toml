[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pothole-measurement"
version = "0.1.0"
description = "From Recognition to Measurement: Pothole Area Estimation through Local Road Geometry"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<6",
]

[project.urls]
Repository = "https://github.com/Wonder-How/potholes_area"

[project.optional-dependencies]
# Authors' checkpoint classes use these Ultralytics internals. Other releases
# need a compatibility audit before use with the supplied architecture.
models = [
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "ultralytics==8.4.144",
  "transformers==4.57.6",
]

[project.scripts]
pothole-measure = "pothole_measurement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
