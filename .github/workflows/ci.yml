name: Geometry and CLI

on:
  push:
  pull_request:

jobs:
  geometry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package
        run: python -m pip install -e .
      - name: Verify geometry and calibration
        run: python -m unittest discover -s tests -v
      - name: Exercise installed CLI
        run: pothole-measure demo --output outputs/demo
      - name: Verify released checkpoint checksum
        run: sha256sum -c weights/SHA256SUMS
